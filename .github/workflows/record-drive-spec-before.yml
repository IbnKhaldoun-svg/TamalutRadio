name: Record Google Drive spec before

on:
  push:
    paths:
      - '.github/workflows/record-drive-spec-before.yml'

permissions:
  contents: write

jobs:
  record-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch spec
        run: python3 .github/scripts/record-drive-spec-before.py
      - name: Commit spec
        run: |
          set -euo pipefail
          git diff --check
          git diff -- PROJECT_SPEC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_SPEC.md
          git commit -m 'docs: define Google Drive music source'
          git push origin HEAD:main
