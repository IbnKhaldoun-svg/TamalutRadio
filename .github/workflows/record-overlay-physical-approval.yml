name: Record overlay physical approval

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/record-overlay-physical-approval.yml

permissions:
  contents: write

jobs:
  record-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record final physical approval
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('PROJECT_SPEC.md')
          text = path.read_text(encoding='utf-8')

          old_status = "- Status: implementation and CI validation are complete for all three refinements; physical validation A-D remains pending. This does not alter the already complete physical approval of overlay 1/2 + 1.5 + 2/2."
          new_status = "- Status: implementation, CI validation, final Release verification, and physical validation A-D are complete for all three refinements. RADIO live pause→resume reconnect, 4,000 ms overlay auto-collapse, and the dedicated return-to-app affordance all passed physical testing on 2026-08-29. The complete floating-overlay path `1/2 + 1.5 + 2/2 + refinement` is therefore fully validated both in CI and physically."
          if text.count(old_status) != 1:
              raise SystemExit(f'Expected exactly one pending refinement status, found {text.count(old_status)}')
          text = text.replace(old_status, new_status, 1)

          old_2_2 = "- CI validation is complete; final physical verification of the expanded overlay controls remains required before declaring the complete floating-overlay feature physically approved."
          new_2_2 = "- CI validation and physical verification of the expanded overlay controls are complete; sub-step 2/2 is physically approved as part of the fully validated floating-overlay path."
          if text.count(old_2_2) != 1:
              raise SystemExit(f'Expected exactly one stale 2/2 physical-pending line, found {text.count(old_2_2)}')
          text = text.replace(old_2_2, new_2_2, 1)

          old_summary = "- **Percorso overlay 1/2 + 1.5/2 + 2/2 completamente validato fisicamente il 2026-08-29: Home, Recenti, root Back, permesso/revoca, pausa, Impostazioni, drag/snap, dismiss session-only, controlli playback, sincronizzazione esterna, capability e transizioni RADIO↔LOCAL tutti confermati.**"
          new_summary = "- **Percorso overlay 1/2 + 1.5/2 + 2/2 + refinement completamente validato in CI e fisicamente il 2026-08-29: Home, Recenti, root Back, permesso/revoca, pausa, Impostazioni, drag/snap, dismiss session-only, controlli playback, sincronizzazione esterna, capability, transizioni RADIO↔LOCAL, riconnessione RADIO al live edge, auto-collapse a 4 secondi e ritorno all'app tutti confermati.**"
          if text.count(old_summary) != 1:
              raise SystemExit(f'Expected exactly one overlay summary line, found {text.count(old_summary)}')
          text = text.replace(old_summary, new_summary, 1)

          marker = "## Decision log\n\n"
          decision = """### 2026-08-29 — Floating overlay refinement physically approved; complete overlay path closed\n\nPhysical checklist A-D completed with every case passing on the final Release `debug-20260829-210309-88c102a` targeting `88c102aee5db2b4e6e4d6a5567f090807cdb7dab`. RADIO pause→resume reconnects to the current live edge after a long pause while LOCAL resumes at the preserved track position; the expanded overlay auto-collapses after approximately 4 seconds of inactivity and correctly re-arms after interaction without affecting playback; the dedicated TamalutRadio app-entry affordance returns to Now Playing without issuing transport commands, and a subsequent external overlay session is created normally. APK SHA-256 `f502581dfcf48863ac5cb6487c909dad01112d731025c8324324fd65619732d3` and persistent debug signer SHA-256 `03225636d52d29f3886592d40747bc85c1c7ad2cafdf622a7d35d409fd928bd6` were verified by final Release run `33274897181`. With the earlier 30/30 approval of overlay 1/2 + 1.5 + 2/2, the entire floating-overlay path including this refinement is now fully validated in CI and physically.\n\n"""
          if decision.strip() in text:
              raise SystemExit('Final physical approval decision already present')
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one Decision log marker, found {text.count(marker)}')
          text = text.replace(marker, marker + decision, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- PROJECT_SPEC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_SPEC.md
          git commit -m "docs: record final overlay physical approval"
          git push origin HEAD:main
