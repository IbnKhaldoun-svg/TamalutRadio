name: Backup restore compile check

on:
  push:
    branches:
      - backup-restore-check-helper

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 00c38553f2d21afc2b183d035de88cc60790d3cb
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          show-download-progress: false

      - name: Provision persistent debug signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/setup-debug-signing.sh

      - name: Install Android command-line tools
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 37 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run backup restore tests and build
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core:database:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:preferences:testDebugUnitTest \
            :feature:radio:testDebugUnitTest \
            :core:playback:testDebugUnitTest \
            :feature:library:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug
